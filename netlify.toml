[build]
  # Deploys run only this command; package "prebuild" scripts never run on Netlify. The
  # extractor's gitignored dist/ must exist before functions bundling, or the bundler silently
  # drops the package from the function archives and the functions crash at runtime.
  # The reinstall defends against Netlify's build cache, which restores node_modules with
  # formerly-symlinked directories materialized as real copies. Stale @types copies from an
  # older pnpm's public hoisting made tsc load duplicate declarations and fail every deploy;
  # relinking from the content-addressed store removes anything pnpm does not own.
  command = "rm -rf node_modules packages/*/node_modules && pnpm install --frozen-lockfile && pnpm --filter @tryghost/algolia-html-extractor build && pnpm typecheck"
  functions = "packages/algolia-netlify/functions"
  publish = "packages/algolia-netlify/public"

[build.environment]
  NODE_VERSION = "24"

[template.environment]
  ALGOLIA_ACTIVE = "Leave TRUE to keep your search index up to date."
  ALGOLIA_APP_ID = "Application ID from Algolia → Settings → API keys"
  ALGOLIA_API_KEY = "Algolia key for this index, with addObject and deleteIndex permissions"
  ALGOLIA_INDEX = "Name of the Algolia index"
  NETLIFY_KEY = "Choose a long random secret. Keep it for the setup page after deployment."
