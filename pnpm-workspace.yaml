packages:
  - packages/*

linkWorkspacePackages: true

# Wait for registry metadata and the tarball before promoting a deployment release.
publishWaitTimeout: 300000

# ipx@3 (via netlify-cli > @netlify/images) pins sharp@^0.34, which has known
# libvips CVEs (GHSA-f88m-g3jw-g9cj); force the patched 0.35 line until ipx@4 ships.
overrides:
  sharp: ^0.35.3
  # GHSA-3g3m-2fjr-6pw4 (glob <=14.0.1): aborted async walks keep traversing.
  # Drop once netlify-cli and nx resolve a patched version on their own.
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  # GHSA-g3hv-75wg-m249 (minimatch <11.0.1): globparts amplification DoS.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  # nx calls minimatch.makeRe, which minimatch 11 removed; the patch below
  # restores makeRe on this exact version as a wrapper over the safe v11
  # matcher. Keep the pin and the patch in sync, and drop both once nx ships
  # with minimatch >=11.0.1.
  'nx>minimatch': 11.0.5

# deepmerge has no patched release. This applies the upstream fix from
# TehShrike/deepmerge#274 for CVE-2026-93753 (GHSA-gcqx-w48m-w2h4).
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
  minimatch@11.0.1: patches/minimatch@11.0.1.patch

allowBuilds:
  esbuild: true
  netlify-cli: false
  nx: true
  sharp: false
  unix-dgram: false

minimumReleaseAgeExclude:
  - '@tryghost/content-api'
  - '@tryghost/errors'
  - '@tryghost/pretty-cli'
