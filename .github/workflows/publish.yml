name: Publish

on:
  push:
    branches:
      - main
    paths:
      - 'packages/*/package.json'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview what would be published without publishing
        required: false
        type: boolean
        default: true
      prerelease-tag:
        description: Isolated PR channel (for example pr-333); leave empty for stable main releases
        required: false
        type: string
        default: ''

env:
  PRERELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['prerelease-tag'] || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Published new versions'))) || (github.event_name == 'workflow_dispatch' && inputs['prerelease-tag'] != '')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CI: true
      FORCE_COLOR: 1
      IS_SHIPPING: true
      NPM_CONFIG_PROVENANCE: true
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release channel
        run: node scripts/release-channel.mts
      - name: Verify npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          node -e 'const actual=process.argv[1].split(".").map(Number); const minimum=[11,5,1]; const difference=actual.findIndex((value,index) => value !== minimum[index]); if (difference !== -1 && actual[difference] < minimum[difference]) process.exit(1)' "$npm_version"
          echo "npm $npm_version"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: deployment
      - name: Run release preflight
        run: |
          pnpm test:coverage
          pnpm typecheck
          pnpm lint
      - name: Build releasable packages
        run: pnpm nx run-many -t build
      - name: Configure npm registry
        run: |
          cat > "$HOME/.npmrc" <<EOF
          registry=https://registry.npmjs.org/
          @tryghost:registry=https://registry.npmjs.org/
          EOF
          npm config get registry
          npm config get @tryghost:registry
      - name: Determine packages to publish
        id: packages
        shell: bash
        run: |
          to_publish=()
          registry_error="$RUNNER_TEMP/npm-view-error"
          for manifest in packages/*/package.json; do
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            if npm view "$name@$version" version >/dev/null 2>"$registry_error"; then
              echo "Skipping $name@$version because it is already published"
            elif grep -q 'E404' "$registry_error"; then
              node scripts/release-channel.mts "$version"
              echo "Queuing $name@$version"
              to_publish+=("$name")
            else
              cat "$registry_error" >&2
              exit 1
            fi
          done
          (IFS=,; echo "projects=${to_publish[*]}") >> "$GITHUB_OUTPUT"
      - name: Publish to npm
        if: steps.packages.outputs.projects != ''
        shell: bash
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || false }}
          PROJECTS: ${{ steps.packages.outputs.projects }}
        run: |
          args=(release publish "--projects=$PROJECTS")
          if [[ -n "$PRERELEASE_TAG" ]]; then
            args+=("--tag=$PRERELEASE_TAG")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          pnpm nx "${args[@]}"

  promote-netlify:
    name: Promote Netlify integration
    needs: publish
    if: github.event_name != 'workflow_dispatch' || !inputs['dry-run']
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Promote the published Netlify package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/promote-netlify-release.mts
