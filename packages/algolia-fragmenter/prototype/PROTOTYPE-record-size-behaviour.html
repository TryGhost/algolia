    root.innerHTML = '<main class="shell"><header class="hero"><p class="kicker">Throwaway prototype \xB7 Wayfinder decision</p><h1>What should happen when a Ghost record is too large?</h1><p class="lede">This demo tests the fragmenter size policy after legacy anchor grouping. It measures complete compact records in UTF-8 bytes and never calls Algolia.</p><p class="recommendation"><strong>Candidate to validate:</strong> pack whole extraction fragments under 9,999 bytes, preserve the first legacy ID, suffix continuations, and reject indivisible content locally.</p></header><section class="card section"><div class="section-header"><div><h2>1. Pick a policy</h2><p>Three deliberately different answers to the same overflow.</p></div></div><div class="policy-grid">' + policyCards + '</div></section><section class="card section"><div class="section-header"><div><h2>' + escapeHtml(policy.name) + "</h2><p>" + escapeHtml(policy.thesis) + '</p></div></div><dl class="facts"><div><dt>Split boundary</dt><dd>' + escapeHtml(policy.boundary) + "</dd></div><div><dt>Stable IDs</dt><dd>" + escapeHtml(policy.ids) + "</dd></div><div><dt>Ranking and links</dt><dd>" + escapeHtml(policy.ranking) + "</dd></div><div><dt>Failure</dt><dd>" + escapeHtml(policy.failure) + '</dd></div></dl></section><section class="card section"><div class="section-header"><div><h2>2. Drive a case</h2><p>' + escapeHtml(scenario.question) + '</p></div><button class="secondary" data-action="reset">Reset</button></div><div class="controls"><label>Policy<select data-action="policy-select">' + policyOptions + '</select></label><label>Case<select data-action="scenario-select">' + scenarioOptions + '</select></label><button class="run" data-action="run">Run local preflight</button></div><p class="state-note"><strong>Case note:</strong> ' + escapeHtml(scenario.note) + '</p><p class="state-note"><strong>Last change:</strong> ' + escapeHtml(state.lastChange) + " \xB7 Status: " + state.status + '</p><div class="fragment-list">' + renderFragments(scenario) + '</div></section><section class="card section"><div class="section-header"><div><h2>3. Inspect complete output records</h2><p>Each meter includes projected metadata, IDs, headings, ranking, URLs, and HTML.</p></div></div>' + renderOutcome(state.outcome) + '</section><section class="card section"><div class="section-header"><div><h2>4. Guided walkthroughs</h2><p>Start a tab, then press its numbered steps in order.</p></div></div><div class="tabs">' + tabs + "</div>" + walkthroughs.map((candidate) => renderWalkthrough(candidate, state)).join("") + '</section><p class="footer">Strict TypeScript source; generated JavaScript exists only inside this double-clickable HTML artifact.</p></main>';

  var advanceWalkthrough = (stepIndex) => {
