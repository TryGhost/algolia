                <label>Case
                    <select data-action="scenario-select">
                        ${scenarios.map((candidate) => `<option value="${candidate.id}" ${candidate.id === scenario.id ? "selected" : ""}>${escapeHtml(candidate.name)}</option>`).join("")}
                    </select>
                </label>
                <button class="run" data-action="run">Run the call</button>
            </div>
            <div class="input-panel">
                <p class="eyebrow">Rendered HTML or runtime input</p>
                <pre>${escapeHtml(scenario.renderedHtml)}</pre>
            </div>
            <p class="state-note"><strong>Last change:</strong> ${escapeHtml(state.lastChange)} \xB7 Status: ${state.status}</p>
            <div class="result">${renderOutcome(state.outcome)}</div>
        </section>

        <section class="card section">
            <div class="section-header">
                <div>
                    <h2>3. Guided walkthroughs</h2>
                    <p>Start a tab, then press its numbered steps in order.</p>
                </div>
            </div>
            <div class="tabs" role="tablist" aria-label="Prototype walkthroughs">
                ${walkthroughs.map((candidate) => `<button class="tab ${candidate.id === walkthrough.id ? "active" : ""}" data-action="start-walkthrough" data-walkthrough-id="${candidate.id}" role="tab" aria-selected="${candidate.id === walkthrough.id}">${escapeHtml(candidate.name)}</button>`).join("")}
            </div>
            ${walkthroughs.map((candidate) => renderWalkthrough(candidate, state)).join("")}
        </section>

        <p class="footer">Prototype source is strict TypeScript. The HTML file is generated only to make the artifact double-clickable.</p>
    </main>`;
  };
  var advanceWalkthrough = (stepIndex) => {
    const walkthrough = getWalkthrough(state.activeWalkthroughId);
    const step = walkthrough.steps[stepIndex];
    if (step === void 0 || stepIndex !== state.nextWalkthroughStep) {
      return;
    }
    state = {
      ...transition(state, step.action),
      activeWalkthroughId: state.activeWalkthroughId,
      nextWalkthroughStep: stepIndex + 1
    };
  };
  root.addEventListener("click", (event) => {
    const target = event.target;
    if (!(target instanceof globalThis.Element)) {
      return;
    }
    const button = target.closest("button[data-action]");
    if (button === null) {
      return;
    }
    const action = button.dataset.action;
    if (action === "select-design" && isDesignId(button.dataset.designId)) {
      state = transition(state, { type: "select-design", designId: button.dataset.designId });
    } else if (action === "run") {
      state = transition(state, { type: "run" });
    } else if (action === "reset") {
      state = transition(state, { type: "reset" });
    } else if (action === "start-walkthrough" && button.dataset.walkthroughId !== void 0) {
      state = transition(state, {
        type: "start-walkthrough",
        walkthroughId: button.dataset.walkthroughId
      });
    } else if (action === "walkthrough-step" && button.dataset.stepIndex !== void 0) {
      const stepIndex = Number.parseInt(button.dataset.stepIndex, 10);
      if (Number.isInteger(stepIndex)) {
        advanceWalkthrough(stepIndex);
      }
    }
    render();
  });
  root.addEventListener("change", (event) => {
    const target = event.target;
    if (!(target instanceof globalThis.HTMLSelectElement)) {
      return;
    }
    const action = target.dataset.action;
    if (action === "design-select" && isDesignId(target.value)) {
      state = transition(state, { type: "select-design", designId: target.value });
    } else if (action === "scenario-select" && isScenarioId(target.value)) {
      state = transition(state, { type: "select-scenario", scenarioId: target.value });
    }
    render();
  });
  render();
})();
</script>
</body>
</html>
