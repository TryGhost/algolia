[build]
  base = "."
  # Deploys run only this command; package "prebuild" scripts never run on Netlify. The
  # extractor's gitignored dist/ must exist before functions bundling, or the bundler silently
  # drops the package from the function archives and the functions crash at runtime.
  command = "pnpm --filter @tryghost/algolia-html-extractor build && pnpm typecheck"
  functions = "functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "24"

[template.environment]
  ALGOLIA_ACTIVE = "TRUE or FALSE. Set to TRUE to trigger indexing."
  ALGOLIA_APP_ID = "Algolia Application ID"
  ALGOLIA_API_KEY = "Algolia API key restricted to this index, with addObject and deleteIndex permissions"
  ALGOLIA_INDEX = "Name of the Algolia index"
  NETLIFY_KEY = "User-defined key to authorize post requests to the Netlify function"
